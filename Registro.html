  <!-- formulario de registro -->
  <div class="container">
     <h4>Realice su registro</h4>
      <div class="row">
<!-- Primera columna ----------------------------------------->
          <div class="col-sm-4 jumbotron">
            
             <form action="">
             
                <div class="form-group mx-auto d-block">
                    <label for="nombre">Nombre: </label>
                      <input type="nombre" class="form-control" id="nombre">
                </div>

                <div class="form-group mx-auto d-block">
                   <label for="apellido">Apellido 2: </label>
                      <input type="apellido" class="form-control" id="apellido">
                </div>

                   <label for="dia">Fecha de Nacimiento:</label><br>
                    <textarea name="" id="" cols="5" rows="1" placeholder="DD"></textarea>
                    <textarea name="" id="" cols="5" rows="1" placeholder="MM"></textarea>
                    <textarea name="" id="" cols="5" rows="1" placeholder="YYY"></textarea>
                    <br>

                    <label for="otras"> Otras cosas:</label><br>
                     <textarea name="" id="" cols="40" rows="8"></textarea>
                    <button class="btn btn-primary float-right" >Guardar</button>
            </form>
        </div>
<!-- Segunda columna ------------------------------------------------->
          <div class="col-sm-4 jumbotron">
            
             <form action="">
             
            <div class="form-group mx-auto d-block">
                <label for="apellido1">Apellido 1: </label>
                  <input type="apellido1" class="form-control" id="apellido1">
            </div>
            
            <div class="form-group mx-auto d-block">
               <label for="num">Número telefónico: </label>
                  <input type="num" class="form-control" id="num">
            </div>
          
             </form>
